[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breachspider-mcp"
version = "0.1.0"
description = "Read-only MCP server for the BreachSpider ICS/OT device CVE API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CITED Relevance LLC", email = "joshua@citedrelevance.com" }]
keywords = ["breachspider", "mcp", "cve", "ics", "ot", "vulnerability", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.10",
    "breachspider>=0.3.0,<1",
]

[project.urls]
Homepage = "https://breachspider.com/developers"
Documentation = "https://breachspider.com/docs"
Source = "https://github.com/Citedrelevance/breachspider-mcp"

[project.scripts]
breachspider-mcp = "breachspider_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=7", "responses>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the live API in demo mode (skipped when BREACHSPIDER_SKIP_LIVE=1)"]
